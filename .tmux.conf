###############
# Tmux
###############

# original bindings
#     all bound to C-b
# Basics
#     ? get help
# Session management
#     s list sessions
#     $ rename the current session
#     d detach from the current session
# Windows
#     c create a new window
#     , rename the current window
#     w list windows
#     % split horizontally
#     " split vertically
#     n change to the next window
#     p change to the previous window
#     0 to 9 select windows 0 through 9
# Panes
#     % create a horizontal pane
#     " create a vertical pane
#     h move to the left pane. *
#     j move to the pane below *
#     l move to the right pane *
#     k move to the pane above *
#     q show pane numbers
#     o toggle between panes
#     } swap with next pane
#     { swap with previous pane
#     ! break the pane out of the window
#     x kill the current pane

##
## Sensible
## https://github.com/tmux-plugins/tmux-sensible
##

set -s escape-time 0 # address switching delay
set -s set-clipboard on

set -g default-terminal screen-256color
set -as terminal-features ",xterm-256color:RGB"
set -ga terminal-overrides ",*:Tc"
set -g extended-keys always
set -gs extended-keys-format csi-u
bind-key -n S-Enter send-keys Escape '[13;2u'
bind-key -n S-Up send-keys Escape '[1;2A'
bind-key -n S-Down send-keys Escape '[1;2B'
set -g history-limit 50000
set -g mouse on
set -g display-time 3000				# tmux messages are displayed in millis
set-option -g allow-rename off 	# don't rename windows automatically
set -g focus-events on					# focus events enabled for terminals that support them
setw -g aggressive-resize on		# super useful when using "grouped sessions" and multi-monitor setup

set -g default-shell "/bin/zsh"
set -g default-command "/bin/zsh -l"

# Notifications
set -g visual-activity on
setw -g monitor-activity on
set -g visual-bell on
set -g visual-silence off
set -g bell-action none

##
## Personal bindings
##
# remap 'C-b'
unbind C-b
set-option -g prefix C-t
bind-key C-t send-prefix # t for tmux
bind r source-file ~/.tmux.conf # reload config file

##
## Windows & Panes
##
set -g base-index 1								# window num from 1 not 0
set-option -g renumber-windows on # renumber if closed
unbind t
bind t new-window
# easy window jumping
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9
bind-key -n M-0 select-window -t :10
bind-key -n C-PageUp select-window -t +1
bind-key -n C-PageDown select-window -t -1
# switch panes using Shift-arrow without prefix
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D
# switch panes also using vi home row
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D
# swap window
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1
# split commands using emacs bindings
bind 2 split-window -v
bind 3 split-window -h
unbind '"'
unbind %
# rename pane
unbind .
bind . command-prompt -p "Pane title:" "select-pane -T '%%'"

# copy pasta
bind -T copy-mode C-w send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"
bind -T copy-mode M-w send-keys -X copy-pipe-and-cancel "pbcopy"

# simpler synchronise panes toggle
bind-key -n M-s set-window-option synchronize-panes

##
## Design
##

# reset formats
set -gu status-format
set -gu status-left
set -gu status-right
setw -gu window-status-format
setw -gu window-status-current-format

# panes
set -g pane-border-style 'fg=black'
set -g pane-active-border-style 'fg=green'

set -g message-style fg=white,bg=default
setw -g window-status-current-style fg=yellow,bold
setw -g window-status-current-format ' #I:#{?#{==:#{pane_title},#{host}},,#{pane_title}:}#{pane_current_command} '
setw -g window-status-style fg=colour244
setw -g window-status-format ' #I:#W '
setw -g window-status-bell-style fg=colour1

# status line
set -g status-keys emacs
set -g status-style bg=default
set -g status-justify centre

# Powerline commented out as not super useful for now
# run-shell -b 'command -v powerline-daemon >/dev/null 2>&1 && powerline-daemon -q' # start the daemon quietly (safe if already running)
# set -g status-left  "#[fg=black,bg=colour220,bold] #S #[fg=black,bg=white,bold] #W #[default] #(powerline tmux left)"
# set -g status-right "#(powerline tmux right)"

set -g status-left  "#[fg=black,bg=colour220,bold] #S #[fg=black,bg=white,bold] #W #[default]"
set -g status-right '#[fg=yellow,bold] %d/%m #[fg=yellow,bold] %H:%M:%S '
set -g status-left-length  120
set -g status-right-length 50
set -g status-interval 1

####
# --- FZF Session Switcher ---
####
unbind s
bind-key s display-popup -E -w 90% -h 70% "sh -lc '
  tmux list-sessions -F \"#{session_name}\" |
  fzf --height=100% --reverse --border --ansi \
      --prompt=\"Switch session > \" \
      --preview \"tmux list-windows -t {} -F \\\"#I:#W#{?window_active,*,}  #{pane_current_path}\\\"\" \
  | xargs -r tmux switch-client -t
'"

